name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
      - "*/*"

env:
  SUPABASE_VERSION: 2.75.0
  EXCLUDED_SUPABASE_SERVICES: imgproxy,inbucket,pgadmin-schema-diff,migra,studio,deno-relay
  # Qemu release page: https://github.com/espressif/qemu/releases/tag/esp-develop-8.2.0-20240122
  QEMU_LINUX_URL: https://github.com/espressif/qemu/releases/download/esp-develop-8.2.0-20240122/qemu-xtensa-softmmu-esp_develop_8.2.0_20240122-x86_64-linux-gnu.tar.xz
  QEMU_MACOS_URL: https://github.com/espressif/qemu/releases/download/esp-develop-8.2.0-20240122/qemu-xtensa-softmmu-esp_develop_8.2.0_20240122-aarch64-apple-darwin.tar.xz
  QEMU_WINDOWS_URL: https://github.com/espressif/qemu/releases/download/esp-develop-8.2.0-20240122/qemu-xtensa-softmmu-esp_develop_8.2.0_20240122-x86_64-w64-mingw32.tar.xz


jobs:
  build:
    strategy:
      # Temporary while diagnosing intermittent host-runtime failures: retain
      # every platform's evidence if another matrix entry fails first.
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        run_supabase_tests: [ false ]
        include:
          - os: ubuntu-latest
            run_supabase_tests: true
          - os: ubuntu-latest
            run_supabase_tests: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          # We have a test that wants to tag a specific commit.
          # As such we need to fetch all history.
          fetch-depth: 0

      - name: Setup environment variables and Toit version
        id: constants
        shell: bash
        run: |
          if [[ "$RUNNER_OS" = "Windows" ]]; then
            BIN_EXTENSION=".exe"
          fi
          echo "BIN_EXTENSION=$BIN_EXTENSION" >> $GITHUB_ENV

          export TOIT_VERSION=$(make dev-sdk-version)
          echo "toitVersion=$TOIT_VERSION" >> $GITHUB_OUTPUT

          # For upload at the end.
          # We only upload for Linux and macOS.
          echo "SNAPSHOTS_DIR=$HOME/.cache/jaguar/snapshots" >> $GITHUB_ENV

      - uses: toitlang/action-setup@v1
        with:
          toit-version: ${{ steps.constants.outputs.toitVersion }}

      - name: Setup Qemu
        shell: bash
        run: |
          mkdir -p downloads
          cd downloads
          if [[ ${{ runner.os }} == "Linux" ]]; then
            curl -L -o qemu-linux.tar.xz $QEMU_LINUX_URL
            tar x -f qemu-linux.tar.xz
            echo "QEMU_EXEC=$PWD/qemu/bin/qemu-system-xtensa" >> $GITHUB_ENV
          elif [[ ${{ runner.os }} == "macOS" ]]; then
            curl -L -o qemu-macos.tar.xz $QEMU_MACOS_URL
            tar x -f qemu-macos.tar.xz
            echo "QEMU_EXEC=$PWD/qemu/bin/qemu-system-xtensa" >> $GITHUB_ENV
          elif [[ ${{ runner.os }} == "Windows" ]]; then
            curl -L -o qemu-windows.tar.xz $QEMU_WINDOWS_URL
            tar x -f qemu-windows.tar.xz
            echo "QEMU_EXEC=$PWD/qemu/bin/qemu-system-xtensa.exe" >> $GITHUB_ENV
          fi
          ls $QEMU_EXEC

      - name: Setup environment
        shell: bash
        run: |
          echo "ARTEMIS_CONFIG=${{ github.workspace }}/test_config" >> $GITHUB_ENV

      # Fetch the dependencies. Different for each platform.
      - name: Install dependencies - Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y -q
          # sdl2 and libslirp are needed for Qemu.
          sudo apt-get install -y -q --no-install-recommends ninja-build libsdl2-2.0-0 libslirp0
          ninja --version
          cmake --version
      - name: Install dependencies - macOS
        if: runner.os == 'macOS'
        run: |
          # sdl2 and libslirp are needed for Qemu.
          brew install ninja sdl2 libslirp
          ninja --version
          cmake --version
      - name: Install dependencies - Windows
        if: runner.os == 'Windows'
        run: |
          choco install ninja
          ninja --version
          cmake --version

      - name: Install Supabase
        if: matrix.run_supabase_tests
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_VERSION }}

      - name: Start Supabase - Toitware
        if: matrix.run_supabase_tests
        shell: bash
        working-directory: ${{ github.workspace }}/supabase_artemis
        run: |
          supabase start -x "$EXCLUDED_SUPABASE_SERVICES"
          supabase status

          source <(supabase status --output=env)

          API_HOST=${API_URL#*http://}
          echo "SUPABASE_TOITWARE_API_HOST=$API_HOST" >> $GITHUB_ENV
          echo "SUPABASE_TOITWARE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV

      - name: Start Supabase - Broker
        if: matrix.run_supabase_tests
        shell: bash
        working-directory: ${{ github.workspace }}/public/supabase_broker
        run: |
          supabase start -x "$EXCLUDED_SUPABASE_SERVICES"
          supabase status

          source <(supabase status --output=env)

          API_HOST=${API_URL#*http://}
          echo "SUPABASE_BROKER_API_HOST=$API_HOST" >> $GITHUB_ENV
          echo "SUPABASE_BROKER_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV

      - name: Run cmake
        shell: bash
        run: |
          make rebuild-cmake
          cmake \
              -DQEMU_PATH="$QEMU_EXEC" \
              build

      - name: Build binaries
        shell: bash
        run: |
          make

      - name: Configure macOS core dumps
        if: (!matrix.run_supabase_tests) && (runner.os == 'macOS')
        shell: bash
        run: |
          sudo sysctl -w kern.corefile="$PWD/build/core.%P" || true

      - name: Test supabase
        if: matrix.run_supabase_tests
        shell: bash
        run: |
          make reload-supabase-schemas
          make test-supabase

      - name: Diagnose HTTP upload scheduling
        # Compare a client/server pair in one Toit VM with the same server in a
        # child VM. Sample socket queues faster than the observed ~200 ms cycle.
        if: (!matrix.run_supabase_tests) && (runner.os == 'Linux')
        shell: bash
        run: |
          while true; do
            date --iso-8601=ns
            ss -Htinmp state established
            sleep 0.1
          done > build/http-upload-sockets.log &
          http_socket_monitor_pid=$!

          stop_http_socket_monitor() {
            kill "$http_socket_monitor_pid" 2>/dev/null || true
            wait "$http_socket_monitor_pid" 2>/dev/null || true
          }
          trap stop_http_socket_monitor EXIT

          {
            echo "CPU state before HTTP diagnostic"
            cat /sys/fs/cgroup/cpu.stat
            toit run --project-root tests tests/http-upload-diagnostic.toit -- same 20
            echo "CPU state between HTTP diagnostic modes"
            cat /sys/fs/cgroup/cpu.stat
            toit run --project-root tests tests/http-upload-diagnostic.toit -- \
                separate 20 toit tests/http-upload-diagnostic.toit tests
            echo "Stress the original slow HTTP test"
            make disable-supabase-tests
            # Populate the SDK and envelope arguments that the normal
            # `make test` target prepares before invoking CTest.
            make download-sdk
            for attempt in {1..10}; do
              echo "Original slow HTTP test attempt $attempt/10"
              ctest --test-dir build/tests -C default \
                  --no-tests=error \
                  --verbose \
                  -R '^/tests/cmd-pod-list-test-slow\.toit --http-server --http-toit-broker$'
            done
            echo "CPU state after HTTP diagnostic"
            cat /sys/fs/cgroup/cpu.stat
          } 2>&1 | tee build/http-upload-diagnostic.log

          stop_http_socket_monitor
          trap - EXIT

      - name: Test
        if: (!matrix.run_supabase_tests)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" = "macOS" ]]; then
            ulimit -c unlimited
          fi

          # The HTTP slowdown has only reproduced while the full suite is
          # running concurrently. Keep the socket and scheduler monitors alive
          # around that suite so a failure shows whether the client is blocked
          # by TCP backpressure or by process scheduling.
          if [[ "$RUNNER_OS" = "Linux" ]]; then
            while true; do
              date --iso-8601=ns
              ss -Htinmp state established
              sleep 0.1
            done > build/full-suite-sockets.log &
            full_suite_socket_monitor_pid=$!

            while true; do
              date --iso-8601=ns
              cat /sys/fs/cgroup/cpu.stat
              cat /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory
              ps -eLo pid,ppid,tid,stat,psr,pcpu,wchan:32,comm
              sleep 1
            done > build/full-suite-system.log &
            full_suite_system_monitor_pid=$!

            stop_full_suite_monitors() {
              kill "$full_suite_socket_monitor_pid" \
                  "$full_suite_system_monitor_pid" 2>/dev/null || true
              wait "$full_suite_socket_monitor_pid" \
                  "$full_suite_system_monitor_pid" 2>/dev/null || true
            }
            trap stop_full_suite_monitors EXIT
          fi

          make disable-supabase-tests
          make test

          if [[ "$RUNNER_OS" = "Linux" ]]; then
            stop_full_suite_monitors
            trap - EXIT
          fi

      - name: Stress macOS Qemu teardown
        # Temporary: qemu-trigger-test intermittently segfaults the host Toit
        # VM while terminating Qemu and cancelling its pipe-reader tasks.
        if: (!matrix.run_supabase_tests) && (runner.os == 'macOS')
        shell: bash
        run: |
          ulimit -c unlimited
          for attempt in {1..20}; do
            echo "Qemu teardown attempt $attempt/20"
            ctest --test-dir build/tests -C default -j2 \
                --no-tests=error \
                --output-on-failure \
                -I 66,67,1
          done

      - name: Stress Windows Qemu networking
        # Temporary: qemu-hello-test intermittently boots without an Ethernet
        # connection on the Windows runner and then times out.
        if: (!matrix.run_supabase_tests) && (runner.os == 'Windows')
        shell: bash
        run: |
          for attempt in {1..10}; do
            echo "Qemu networking attempt $attempt/10"
            ctest --test-dir build/tests -C default -j2 \
                --no-tests=error \
                --output-on-failure \
                -I 64,65,1
          done

      - name: Collect macOS native backtrace
        if: (!matrix.run_supabase_tests) && (runner.os == 'macOS') && always()
        shell: bash
        run: |
          shopt -s nullglob
          cores=(build/core.*)
          for core in "${cores[@]}"; do
            echo "Backtrace for $core"
            lldb --batch -o 'thread backtrace all' -c "$core"
          done > build/macos-native-backtrace.log

      - name: Upload binary artifacts
        if: (!matrix.run_supabase_tests)
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ runner.os }}
          path: build/bin

      - name: Upload snapshot artifacts
        # Use 'always()' to upload them even if an earlier step failed.
        if: (!matrix.run_supabase_tests) && always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-${{ runner.os }}
          path: build/snapshots

      - name: Collect test diagnostics
        if: (!matrix.run_supabase_tests) && always()
        shell: bash
        run: |
          find build -path '*/Testing/Temporary/LastTest.log*' -type f \
              -exec grep -h -E \
              "Test #[0-9]+:|Starting SDK tool|SDK tool .* exited|HTTP client|HTTP server" \
              {} + > build/test-diagnostics.log || true

      - name: Upload test diagnostics
        # CTest suppresses successful test output in the workflow log. Upload
        # only the sanitized timing lines: its complete log contains test
        # authentication payloads.
        if: (!matrix.run_supabase_tests) && always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ runner.os }}
          path: build/test-diagnostics.log

      - name: Upload Linux HTTP diagnostics
        if: (!matrix.run_supabase_tests) && (runner.os == 'Linux') && always()
        uses: actions/upload-artifact@v7
        with:
          name: http-upload-diagnostics-${{ runner.os }}
          path: |
            build/http-upload-diagnostic.log
            build/http-upload-sockets.log
            build/full-suite-sockets.log
            build/full-suite-system.log
            build/tests/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Upload macOS crash reports
        # The macOS crash is below the Toit language stack. Preserve the native
        # report when CrashReporter produces one.
        if: (!matrix.run_supabase_tests) && (runner.os == 'macOS') && always()
        uses: actions/upload-artifact@v7
        with:
          name: crash-reports-${{ runner.os }}
          path: |
            ~/Library/Logs/DiagnosticReports/toit.run*
            /Library/Logs/DiagnosticReports/toit.run*
            build/macos-native-backtrace.log
          if-no-files-found: ignore

      - name: Upload other snapshots
        # Use 'always()' to upload them even if an earlier step failed.
        if: (!matrix.run_supabase_tests) && (runner.os != 'Windows') && always()
        uses: actions/upload-artifact@v7
        with:
          name: other-snapshots-${{ runner.os }}
          path: ${{ env.SNAPSHOTS_DIR }}

  arm64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          # We have a test that wants to tag a specific commit.
          # As such we need to fetch all history.
          fetch-depth: 0

      - name: Setup Toit version
        id: constants
        shell: bash
        run: |
          export TOIT_VERSION=$(make dev-sdk-version)
          echo "toitVersion=$TOIT_VERSION" >> $GITHUB_OUTPUT

      - uses: toitlang/action-setup@v1
        with:
          toit-version: ${{ steps.constants.outputs.toitVersion }}

      - name: Setup environment
        shell: bash
        run: |
          echo "ARTEMIS_CONFIG=${{ github.workspace }}/test_config" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update -y -q
          sudo apt-get install -y -q --no-install-recommends ninja-build
          ninja --version
          cmake --version

      - name: Configure
        shell: bash
        run: |
          make rebuild-cmake
          cmake -B build -DARTEMIS_ARCH=arm64 -DARTEMIS_OS=linux
          make disable-supabase-tests
          make disable-qemu-tests

      - name: Build binaries
        shell: bash
        run: |
          make

      - name: Start http-servers
        shell: bash
        run: |
          make start-http &
          echo "HTTP_PID=$!" >> $GITHUB_ENV
          sleep 10
          make setup-local-dev
          mkdir -p $HOME/.config/artemis
          cp $HOME/.config/artemis-dev/config config

      - name: Test executables
        uses: pguyot/arm-runner-action@v2
        with:
          cpu: cortex-a7
          base_image: "raspios_lite_arm64:2022-04-04"
          image_additional_mb: 500
          commands: |
              uname -m
              sudo apt-get update -y
              sudo apt-get install -y git
              export HOME=$(pwd)
              export ARTEMIS_CONFIG=$HOME/config
              build/bin/artemis --version
              mkdir fleet
              export ARTEMIS_FLEET_ROOT=$PWD/fleet
              build/bin/artemis fleet init
              sed -i 's/artemis-version.*//' fleet/my-pod.yaml
              echo "artemis-version: ${{ github.ref }}" >> fleet/my-pod.yaml
              build/bin/artemis pod build -o test.pod fleet/my-pod.yaml

      - name: Kill http-servers
        shell: bash
        run: |
          kill $HTTP_PID

  serial:
    # The hardware suite is already running for this commit series. Avoid
    # occupying the single serial runner again for hosted-runtime probes.
    if: false
    runs-on: serial-artemis

    steps:
      - name: Clean workspace
        run: |
          rm -rf ${{ github.workspace }}/*

      - uses: actions/checkout@v6

      - name: Add local bin to PATH
        run: |
          echo "$HOME/local/bin" >> $GITHUB_PATH

      # Downloads the SDK that is defined in the Makefile
      # Reuses the SDK if it's already downloaded.
      - name: Setup Toit SDK
        run: |
          ARCHITECTURE=$(uname -m)
          SDK_VERSION=$(make dev-sdk-version)
          TOIT_SDK=$HOME/.cache/artemis/sdks/$SDK_VERSION

          # Check whether the SDK is already downloaded.
          if [[ -d $TOIT_SDK ]]; then
            echo "SDK already downloaded."
          else
            mkdir -p $HOME/.cache/artemis/sdks
            if [[ $ARCHITECTURE == "x86_64" ]]; then
              TAR_BALL_NAME=toit-linux
            elif [[ $ARCHITECTURE == "armv7l" ]]; then
              TAR_BALL_NAME=toit-rpi
            else
              echo "Unsupported architecture: $ARCHITECTURE"
              exit 1
            fi
            wget https://github.com/toitlang/toit/releases/download/$SDK_VERSION/$TAR_BALL_NAME.tar.gz
            tar x -zf $TAR_BALL_NAME.tar.gz
            mv toit $TOIT_SDK
          fi
          echo "SDK_VERSION=$SDK_VERSION" >> $GITHUB_ENV
          echo "TOIT_SDK=$TOIT_SDK" >> $GITHUB_ENV
          echo "TOIT=$TOIT_SDK/bin/toit" >> $GITHUB_ENV

      - name: Run cmake
        shell: bash
        run: |
          make rebuild-cmake
          cmake -DTOIT="$TOIT" build

      # The SDK is already downloaded, but we might still need envelopes.
      - name: Download envelopes
        run: |
          make TOIT=$TOIT download-sdk

      - name: Disable Supabase tests
        run: |
          make TOIT=$TOIT disable-supabase-tests

      - name: Disable QEMU tests
        run: |
          make TOIT=$TOIT disable-qemu-tests

      - name: Build
        run: |
          make TOIT=$TOIT

      - name: Run serial tests
        run: |
          # Get the uart-port and wifi configuration from the file in the runner's home.
          source $HOME/artemis-test.env
          make TOIT=$TOIT test-serial

      # Erase the flash of the device.
      # We don't want it to behave erratically against the WiFi hotspot,
      # which could make future tests fail more easily.
      - name: Erase device flash
        if: always()
        run: |
          $TOIT_SDK/lib/toit/bin/esptool --port /dev/ttyArtemis erase_flash
